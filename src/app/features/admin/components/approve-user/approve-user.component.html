@if (unapprovedUsers | async; as users) {
  @if (users.length) {
    <div class="section-card" @enterAnimation>
      <div class="section-header">
        <mat-icon class="section-icon pending-icon">pending</mat-icon>
        <span class="mat-title-small section-title">{{ "AUTH.APPROVE.TITLE" | translate }}</span>
        <span class="count-badge">{{ users.length }}</span>
      </div>
      <div class="users-body">
        @for (user of users; track user.id; let last = $last) {
          <div class="user-row">
            <div class="user-avatar">
              <mat-icon>person</mat-icon>
            </div>
            <div class="user-info">
              <span class="user-name">{{ user.name }}</span>
              <span class="user-email">{{ user.email }}</span>
            </div>
            <div class="user-actions">
              <button mat-icon-button class="approve-btn" (click)="approveUser(user.id)">
                <mat-icon>check_circle</mat-icon>
              </button>
              <button mat-icon-button class="deny-btn" (click)="denieUser(user.id)">
                <mat-icon>cancel</mat-icon>
              </button>
            </div>
          </div>
          @if (!last) {
            <mat-divider />
          }
        }
      </div>
    </div>
  }
}
