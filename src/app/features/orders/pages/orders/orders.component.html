@if (selectedOrderId(); as orderId) {
  <app-order-details
    @enterAnimation
    (closeDetails)="deselectOrder()"
    [orderId]="orderId"
  ></app-order-details>
} @else {
  <app-order-table
    @enterAnimation
    [ngClass]="{ 'd-none': isLoading() }"
    (orderOutput)="selectedOrder($event)"
    (isLoading)="isLoading.set($event)"
  ></app-order-table>
  @if (isLoading()) {
    <div class="d-flex justify-content-center align-items-center h-100">
      <mat-spinner />
    </div>
  }
}
