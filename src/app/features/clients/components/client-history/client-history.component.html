<div class="history-list">
  @for (order of orders(); track $index) {
    <div class="order-card">
      <div class="order-main">
        <span class="order-date">{{ order.dateOrderPlaced | date }}</span>
        <span class="order-amount">{{ order.totalAmount | number: "1.0-0" }} RON</span>
      </div>
      @if (order.dateOrderDelivered) {
        <div class="order-delivered">
          <i class="material-icons delivered-icon">check_circle</i>
          <span>{{ order.dateOrderDelivered | date }}</span>
        </div>
      }
      <button mat-stroked-button class="details-btn" (click)="goToDetailsPage(order)">
        {{ "ADD_CLIENT.DETAILS" | translate }}
      </button>
    </div>
  }
</div>
