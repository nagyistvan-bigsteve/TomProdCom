<div class="content" @enterAnimation>
  <div class="icon-wrapper">
    <mat-icon class="pending-icon">pending_actions</mat-icon>
  </div>

  <div class="text-section">
    <h2 class="mat-title-large heading">{{ "AUTH.WAIT_TO_APPROVE.HEADING" | translate }}</h2>
    <p class="mat-body-medium message">{{ "AUTH.WAIT_TO_APPROVE.TITLE" | translate }}</p>
  </div>

  <button mat-stroked-button class="refresh-btn" (click)="tryRefresh()">
    <mat-icon>refresh</mat-icon>
    {{ "AUTH.WAIT_TO_APPROVE.BUTTON" | translate }}
  </button>
</div>
