<div class="page-header">
  <span class="mat-title-medium header-title">{{ "NAVBAR.ACCOUNT" | translate }}</span>
</div>

<div class="page-content">
  <div class="profile-card">
    <div class="avatar">
      <mat-icon class="avatar-icon">person</mat-icon>
    </div>
    <div class="profile-info">
      <span class="profile-name mat-title-large">{{ authStore.name() }}</span>
      <div class="profile-detail">
        <mat-icon class="detail-icon">mail</mat-icon>
        <span class="mat-body-medium">{{ authStore.email() }}</span>
      </div>
      <div class="profile-detail">
        <mat-icon class="detail-icon">badge</mat-icon>
        <span class="role-chip">{{ authStore.role() }}</span>
      </div>
    </div>
    <button mat-stroked-button class="logout-btn" (click)="authStore.logout()">
      <mat-icon>logout</mat-icon>
      {{ "USER.LOG_OUT" | translate }}
    </button>
  </div>

  @if (authStore.role() === 'admin') {
    <div class="admin-section">
      @if (unaprovedUsers | async; as users) {
        @if (users.length) {
          <app-approve-user @enterAnimation />
        }
      }
      <app-users-list @enterAnimation />
    </div>
  }
</div>
