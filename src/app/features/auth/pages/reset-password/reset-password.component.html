<div class="auth-wrapper">
  <div class="brand">
    <mat-icon class="brand-icon">forest</mat-icon>
    <span class="brand-name mat-headline-small">TomProdCom</span>
  </div>

  <div class="auth-card">
    <div class="card-header">
      <mat-icon class="header-icon">lock_reset</mat-icon>
      <h2 class="mat-title-medium card-title">{{ "RESET_PASSWORD.TITLE" | translate }}</h2>
    </div>

    @if (showForm) {
      <form
        [formGroup]="resetPasswordForm"
        (ngSubmit)="resetPassword()"
        class="auth-form"
        @enterAnimation
      >
        <mat-form-field appearance="outline" class="field">
          <mat-label>{{ "RESET_PASSWORD.PASSWORD" | translate }}</mat-label>
          <mat-icon matPrefix class="field-icon">lock</mat-icon>
          <input
            matInput
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="new-password"
          />
          <button mat-icon-button matSuffix type="button" class="visibility-btn" (click)="togglePassword()">
            <mat-icon class="field-icon">{{ showPassword() ? "visibility_off" : "visibility" }}</mat-icon>
          </button>
        </mat-form-field>

        <mat-form-field appearance="outline" class="field">
          <mat-label>{{ "RESET_PASSWORD.CONFIRM_PASSWORD" | translate }}</mat-label>
          <mat-icon matPrefix class="field-icon">lock</mat-icon>
          <input
            matInput
            [type]="showConfirm() ? 'text' : 'password'"
            formControlName="confirmPassword"
            autocomplete="new-password"
          />
          <button mat-icon-button matSuffix type="button" class="visibility-btn" (click)="toggleConfirm()">
            <mat-icon class="field-icon">{{ showConfirm() ? "visibility_off" : "visibility" }}</mat-icon>
          </button>
        </mat-form-field>

        <button
          mat-flat-button
          type="submit"
          class="submit-btn"
          [disabled]="resetPasswordForm.invalid"
        >
          {{ "RESET_PASSWORD.SUBMIT" | translate }}
        </button>

        <button mat-button type="button" class="back-btn" (click)="goToAuthPage()">
          <mat-icon class="back-icon">arrow_back</mat-icon>
          {{ "RESET_PASSWORD.BACK_TO_LOGIN" | translate }}
        </button>
      </form>
    } @else {
      <div class="loading-state">
        <mat-spinner [diameter]="36" />
        <p class="mat-body-medium loading-text">{{ "RESET_PASSWORD.VERIFYING" | translate }}</p>
      </div>
    }
  </div>
</div>
