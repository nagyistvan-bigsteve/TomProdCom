<form [formGroup]="signupForm" (ngSubmit)="signUp()" class="auth-form">
  <mat-form-field appearance="outline" class="field">
    <mat-label>{{ "AUTH.SIGN_UP.NAME" | translate }}</mat-label>
    <mat-icon matPrefix class="field-icon">person</mat-icon>
    <input matInput type="text" formControlName="name" autocomplete="name" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="field">
    <mat-label>{{ "AUTH.EMAIL" | translate }}</mat-label>
    <mat-icon matPrefix class="field-icon">alternate_email</mat-icon>
    <input matInput type="email" formControlName="email" autocomplete="email" />
  </mat-form-field>

  <mat-form-field appearance="outline" class="field">
    <mat-label>{{ "AUTH.PASSWORD" | translate }}</mat-label>
    <mat-icon matPrefix class="field-icon">lock</mat-icon>
    <input
      matInput
      [type]="showPassword() ? 'text' : 'password'"
      formControlName="password"
      autocomplete="new-password"
    />
    <button
      mat-icon-button
      matSuffix
      type="button"
      class="visibility-btn"
      (click)="togglePassword()"
    >
      <mat-icon class="field-icon">{{ showPassword() ? "visibility_off" : "visibility" }}</mat-icon>
    </button>
  </mat-form-field>

  <button mat-flat-button type="submit" class="submit-btn" [disabled]="signupForm.invalid">
    {{ "AUTH.SIGN_UP.ENTER" | translate }}
  </button>
</form>
