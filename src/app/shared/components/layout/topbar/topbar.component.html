<mat-toolbar class="topbar">
  <div class="topbar-left">
    @if (authStore.isAuthenticated()) {
      <button
        @enterAndLeaveAnimation
        mat-icon-button
        aria-label="Menu"
        (click)="toggleSidebar()"
        >
        <mat-icon>menu</mat-icon>
      </button>
      <button
        @enterAndLeaveAnimation
        mat-icon-button
        aria-label="Back"
        (click)="goBack()"
        >
        <mat-icon>arrow_back</mat-icon>
      </button>
    }
    @if (installService.installPromptAvailable | async) {
      <button
        mat-icon-button
        aria-label="Install app"
        (click)="installApp()"
        >
        <mat-icon>download</mat-icon>
      </button>
    }
  </div>

  <span class="topbar-spacer"></span>

  <div class="topbar-right">
    <img
      class="topbar-logo"
      src="assets/images/logo-outline.png"
      alt="Logo"
      />
      @if (
        authStore.isAuthenticated() &&
        authStore.role() === "admin" &&
        usersStore.unapprovedCount()
        ) {
        <button mat-icon-button (click)="goToUserPage()">
          <mat-icon
            [matBadge]="usersStore.unapprovedCount() ? usersStore.unapprovedCount() : ''"
          >account_circle</mat-icon>
        </button>
      }
      <app-language-switcher></app-language-switcher>
    </div>
  </mat-toolbar>
